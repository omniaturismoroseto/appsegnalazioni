name: Build APK Android (Omnia Postazioni)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Imposta Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Imposta JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Installa dipendenze npm
        run: npm install

      - name: Sincronizza il progetto Capacitor
        run: npx cap sync android

      - name: Rendi eseguibile gradlew
        run: chmod +x android/gradlew

      # La keystore di firma non sta nel repo (che e' pubblico): arriva dal
      # secret, in base64, e vive solo per la durata della run.
      - name: Ricostruisci la keystore di firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Manca il secret ANDROID_KEYSTORE_BASE64: senza non si puo' firmare."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/omnia-release.p12"

      # APK di release firmato con la chiave stabile: a differenza della firma di
      # debug (che il runner rigenera a ogni run) permette di installare
      # l'aggiornamento sopra la versione gia' presente, senza disinstallare e
      # senza perdere i dati locali dell'app - fra cui omnia_device_id, cioe'
      # l'identita' con cui la postazione e' stata approvata.
      - name: Compila APK di release firmato
        working-directory: android-app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/omnia-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: omnia
          # versionCode deve crescere a ogni build, altrimenti Android rifiuta
          # il pacchetto come aggiornamento.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rimuovi la keystore dal runner
        if: always()
        run: rm -f "$RUNNER_TEMP/omnia-release.p12"

      - name: Carica APK come artifact scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: omnia-postazioni-apk
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
