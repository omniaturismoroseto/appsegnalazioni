name: Build APK Android (Omnia Postazioni)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Imposta Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Imposta JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Installa dipendenze npm
        run: npm install

      - name: Sincronizza il progetto Capacitor
        run: npx cap sync android

      - name: Rendi eseguibile gradlew
        run: chmod +x android/gradlew

      - name: Compila APK di debug
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Carica APK come artifact scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: omnia-postazioni-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
