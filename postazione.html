<script>
// Identificativo di versione da incrementare a ogni pubblicazione (come
// CACHE_VERSION in sw.js): permette a Sentry di dire "questo errore è
// comparso DOPO la modifica X" invece di mescolare tutto insieme.
var SENTRY_RELEASE="omnia-2026-08-27a";
// Manda a Sentry anche tutti i console.error() già sparsi nel codice
// (invece di modificarli uno per uno), così restano visibili anche i
// fallimenti che oggi finivano solo in una console che nessuno guardava.
// Session Replay: registra cosa vedeva/cliccava l'utente prima di un errore
// (testo/input mascherati di default per privacy — dati sensibili nell'app).
Sentry.onLoad(function(){
  Sentry.init({
    release:SENTRY_RELEASE,
    integrations:[
      Sentry.consoleLoggingIntegration({levels:["error"]}),
      Sentry.replayIntegration()
    ],
    replaysSessionSampleRate:0.1,
    replaysOnErrorSampleRate:1.0
  });
});
// Rete di sicurezza globale: il codice dell'app è ora diviso in più file
// (js/core.js, js/map.js, ecc.) invece di un unico blocco avvolto in un
// try/catch — se uno di quei file fallisce a caricarsi/eseguirsi, questo
// mostra comunque una pagina d'errore comprensibile invece di uno schermo
// bianco o a metà caricato.
window.addEventListener("error",function(e){
  try{if(window.Sentry&&typeof Sentry.captureException==="function")Sentry.captureException(e.error||e.message);}catch(e2){}
  var page=document.getElementById("page");
  if(page&&!page.dataset.appStarted){
    page.innerHTML='<div style="padding:20px;color:red;font-size:13px"><b>Errore:</b><br>'+String(e.message||e.error||"Errore sconosciuto")+'</div>';
  }
});
</script>

<!-- Twemoji (ospitato da noi, con controllo d'integrità SRI): rende le emoji dei
     contenuti (🚨 ⚠️ 📞 🔴 🟢 📍 …) come piccole immagini colorate identiche su ogni
     dispositivo (iPhone/Android/Windows), invece delle emoji di sistema. Stesso
     approccio dell'app Omnia-Turni. I loghi degli enti e gli SVG inline non
     contengono caratteri emoji, quindi twemoji non li tocca. -->
<script src="twemoji.min.js" integrity="sha384-Y5xukbGJwykbHHkTbLJykYLcBPFxrwipTbEh0puxhkz9CZ90raTPGe2Ks4vCxsYU"></script>
<script>
(function(){
  var st=document.createElement('style');
  st.textContent='img.emoji{width:1.15em;height:1.15em;vertical-align:-0.15em;margin:0 .02em}';
  document.head.appendChild(st);
})();
// Le SVG delle emoji arrivano dal CDN jsDelivr (versione pinnata); il service
// worker le mette in cache dopo il primo caricamento (offline OK da lì in poi).
var TWEMOJI_OPT={folder:'svg',ext:'.svg',base:'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/'};
function dipingiEmoji(node){try{if(window.twemoji)twemoji.parse(node||document.body,TWEMOJI_OPT);}catch(e){/* mai bloccare il render per un problema estetico */}}
if(document.readyState!=='loading')dipingiEmoji(document.body);
else document.addEventListener('DOMContentLoaded',function(){dipingiEmoji(document.body);});
// L'app riscrive spesso l'HTML (render()/renderPage()): un MutationObserver
// ridipinge i nodi appena aggiunti. twemoji.parse è idempotente, non ritocca le
// <img> già create.
var _twObserver=new MutationObserver(function(muts){for(var i=0;i<muts.length;i++){var a=muts[i].addedNodes;for(var j=0;j<a.length;j++){if(a[j].nodeType===1)dipingiEmoji(a[j]);}}});
_twObserver.observe(document.documentElement,{childList:true,subtree:true});
</script>
<script>
// Accesso al Realtime Database tramite il vero SDK Firebase (autenticazione
// gestita automaticamente dall'SDK stesso — niente più token da allegare a mano).
var firebaseSdk = window.firebase;
// Il pacchetto Sentry vero si carica in modo differito: nei primissimi
// istanti window.Sentry esiste come "guscio" ma metodi come setTag possono
// non esserci ancora — queste funzioni non devono mai far crashare l'app.
function _sentrySetTag(key,val){try{if(window.Sentry&&typeof Sentry.setTag==="function")Sentry.setTag(key,val);}catch(e){}}
function _sentryCapture(err){try{if(window.Sentry&&typeof Sentry.captureException==="function")Sentry.captureException(err);}catch(e){}}
</script>
